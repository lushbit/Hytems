plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.0'
}

group = 'dev.lushbit.hytems'
version = '1.9.1'

repositories {
    mavenCentral()
    maven {
        url = "https://maven.hytale-mods.dev/releases"
    }
}

// Server JAR location - update this path if needed
def serverJarPath = file('libs/HytaleServer.jar')
def projectServerJar = file('server/HytaleServer.jar')
def siblingServerJar = file('../server/HytaleServer.jar')

dependencies {
    // Use HytaleServer.jar from libs folder, or fallback to server folders
    if (serverJarPath.exists()) {
        compileOnly files(serverJarPath)
    } else if (projectServerJar.exists()) {
        compileOnly files(projectServerJar)
    } else if (siblingServerJar.exists()) {
        compileOnly files(siblingServerJar)
    } else {
        // If none exists, still reference libs for error message clarity
        compileOnly files('libs/HytaleServer.jar')
    }
    // JSR305 annotations (@Nonnull, @Nullable)
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'com.google.code.gson:gson:2.10.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

shadowJar {
    archiveClassifier.set('')
    // Exclude server classes from the final JAR
    dependencies {
        exclude(dependency { it.moduleGroup == 'com.hypixel' })
    }
}

tasks.named('build') {
    dependsOn shadowJar
}

// Reads Implementation-Version from a HytaleServer.jar manifest, or null.
def serverJarVersion = { File jar ->
    if (!jar?.exists()) return null
    try {
        new java.util.jar.JarFile(jar).withCloseable { j ->
            return j.manifest?.mainAttributes?.getValue('Implementation-Version')
        }
    } catch (Exception ignored) {
        return null
    }
}

// Keep libs/HytaleServer.jar in sync with the server we actually run against.
// Without the version check a stale jar silently survives a server update and
// the mod compiles against an API that no longer exists at runtime.
tasks.register('copyServerJar') {
    doLast {
        def destJar = file('libs/HytaleServer.jar')
        def src = [file('server/HytaleServer.jar'), file('../server/HytaleServer.jar')].find { it.exists() }
        if (src == null) {
            if (!destJar.exists()) {
                logger.warn("No HytaleServer.jar found in libs/, server/ or ../server/ - compilation will fail.")
            }
            return
        }

        def srcVersion = serverJarVersion(src)
        def destVersion = serverJarVersion(destJar)

        if (!destJar.exists()) {
            logger.lifecycle("Copying HytaleServer.jar ${srcVersion ?: '(unknown version)'} into libs/")
        } else if (destVersion != srcVersion) {
            logger.lifecycle("Server jar changed: libs/ has ${destVersion ?: '(unknown)'}, " +
                    "${src.path} has ${srcVersion ?: '(unknown)'} - refreshing libs/HytaleServer.jar")
        } else {
            return
        }

        copy {
            from src
            into 'libs'
        }
    }
}

// Surface the version we are compiling against so a mismatch is never silent.
tasks.register('printServerJarVersion') {
    doLast {
        def jar = file('libs/HytaleServer.jar')
        println "Compiling against HytaleServer ${serverJarVersion(jar) ?: '(unknown version)'}"
    }
}

tasks.named('compileJava') {
    dependsOn 'copyServerJar'
}

// Deploy plugin JAR to server mods folder
tasks.register('deployToServer', Copy) {
    // Using 'from shadowJar' automatically adds task dependency and proper input tracking
    from shadowJar
    into 'server/mods'
    doLast {
        println "Deployed to server/mods/"
    }
}

// Watch for changes and auto-rebuild (useful during development)
tasks.register('watch') {
    doLast {
        println "Watching for changes... Press Ctrl+C to stop."
        println "Run 'gradle build --continuous' for auto-rebuild on file changes."
    }
}
